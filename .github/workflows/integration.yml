name: verify candidate uv ownership on native Windows

on:
  workflow_dispatch:

jobs:
  verify-uv:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
      - name: Prepare candidate while overriding inherited uv targets
        shell: pwsh
        run: node tests/uv-candidate-windows.cjs (Get-Command uv.exe).Source
