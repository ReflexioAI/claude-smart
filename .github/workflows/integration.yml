name: private Node physical Windows probe

on:
  workflow_dispatch:

jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Exercise exact archive preparation, activation and versioned launcher
        shell: pwsh
        run: |
          $owned = Join-Path $env:RUNNER_TEMP 'owned account λ'
          New-Item -ItemType Directory -Path $owned | Out-Null
          $env:HOME = $owned
          $env:USERPROFILE = $owned
          $env:TMPDIR = $env:RUNNER_TEMP
          try {
            node tests/private-node-windows-diagnostic.cjs "${{ github.workspace }}\bin\claude-smart.js" "$owned"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -Recurse -Force -LiteralPath $owned
          }
