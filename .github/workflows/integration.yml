name: verify private Node ZIP with both PowerShell editions

on:
  workflow_dispatch:

jobs:
  windows-zip:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Verify official archive and Node/npm on each edition
        shell: pwsh
        run: |
          $node = (Get-Command node.exe).Source
          $saved = $env:Path
          $editions = @((Get-Command powershell.exe).Source, (Get-Command pwsh.exe).Source)
          foreach ($edition in $editions) {
            $owned = Join-Path $env:RUNNER_TEMP ('owned archive λ ' + [Guid]::NewGuid().ToString())
            New-Item -ItemType Directory -Path $owned | Out-Null
            $env:HOME = $owned
            $env:USERPROFILE = $owned
            $env:Path = (Split-Path $edition) + ';' + (Split-Path $node) + ';' + (Join-Path $env:SystemRoot 'System32')
            try {
              Write-Host ('VERIFIED_EDITION ' + $edition)
              & $node tests/private-node-windows-diagnostic.cjs "${{ github.workspace }}\bin\claude-smart.js" "$owned"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally {
              $env:Path = $saved
              Remove-Item -Recurse -Force -LiteralPath $owned
            }
