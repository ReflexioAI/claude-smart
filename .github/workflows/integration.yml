name: verify installed SDK identity on native Windows

on:
  workflow_dispatch:

jobs:
  verify-sdk:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact sources and reject a native package junction
        run: node tests/sdk-junction.cjs
