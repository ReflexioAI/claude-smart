[project]
name = "claude-smart"
version = "0.3.15"
description = "Self-improving Claude Code, Codex, and OpenCode plugin that turns corrections and successful workflows into Preferences, Project-specific skills, and Shared skills"
keywords = [
    "claude",
    "claude-code",
    "claude-code-plugin",
    "codex",
    "codex-plugin",
    "opencode",
    "opencode-plugin",
    "memory",
    "agent-memory",
    "persistent-memory",
    "local-memory",
    "ai-agent-memory",
    "plugin",
    "reflexio",
    "self-improvement",
    "self-improving-agents",
    "agent-learning",
    "skills",
    "learning",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core Reflexio client/backend package. This is the PyPI baseline used by
    # normal installs; vendor releases may override it after uv sync by
    # installing plugin/vendor/reflexio. Keep in sync via
    # scripts/sync-reflexio-dep.py.
    "reflexio-ai>=0.2.32",
    # Keep both the PyPI baseline and vendored runtime above the security floor.
    "litellm>=1.103.1,<2",
    # The pinned vendor uses strict JSON decoding beyond the PyPI baseline.
    # Vendor installation uses --no-deps, so keep its requirement in the lock.
    "simplejson>=4.2.0",
    "einops>=0.8.0",
    # Native SQLite vector KNN for local storage. Reflexio can fall back to
    # Python ranking without this, but installed claude-smart should include
    # the accelerator by default.
    "sqlite-vec>=0.1.6",
    "filelock>=3.20.3",
]

# claude-smart is distributed via npm only (see bin/claude-smart.js); it is not
# published to PyPI, so there is no `claude-smart` console script / uvx entry
# point. The optimizer helper remains available for explicit server-side binding;
# session hooks never configure its admission, budgets or backend. The hook
# can also run via `python -m claude_smart.hook`.
[project.scripts]
claude-smart-hook = "claude_smart.hook:main"
claude-smart-optimizer-assistant = "claude_smart.optimizer_assistant:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_smart"]

[tool.hatch.build.targets.sdist]
include = [
    "src/claude_smart",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
